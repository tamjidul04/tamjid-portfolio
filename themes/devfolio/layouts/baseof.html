<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}" data-theme="dark" class="{{ if site.Params.animations }}motion{{ end }}{{ if site.Params.cursor }} custom-cursor{{ end }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ if site.Params.animatedBackground }}<canvas class="network" aria-hidden="true"></canvas>{{ end }}
  {{ if site.Params.animations }}<div class="progress" aria-hidden="true"></div>{{ end }}
  <a class="skip" href="#main">Skip to content</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ $index := partialCached "search-index.html" . }}
  <dialog class="search" data-index="{{ $index }}" aria-label="Search">
    <div class="search__row">
      <input type="search" placeholder="Search…" aria-label="Search the site" autocomplete="off">
      <button class="btn btn--ghost btn--small search__close" type="button">Close</button>
    </div>
    <p class="search__status" role="status"></p>
    <ul></ul>
  </dialog>
</body>
</html>
